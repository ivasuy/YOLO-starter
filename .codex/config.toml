# .codex/config.toml
# Minimal Codex project config.
# Goal: stop permission spam, keep edits inside workspace, and provide useful profiles.

model = "gpt-5.4"
model_provider = "openai"

model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
model_reasoning_summary = "auto"
model_verbosity = "medium"

# No repeated prompts for normal repo work.
approval_policy = "never"

# Safe default: Codex can write in this project, not the whole machine.
sandbox_mode = "danger-full-access"

[agents]
# Keep fan-out controlled.
max_threads = 3
max_depth = 1
job_max_runtime_seconds = 1200

[profiles.explorer]
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
model_verbosity = "low"
approval_policy = "never"
sandbox_mode = "read-only"

[profiles.implementer]
model = "gpt-5.4"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
model_verbosity = "medium"
approval_policy = "never"
sandbox_mode = "workspace-write"

[profiles.codex-heavy]
model = "gpt-5.3-codex"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_verbosity = "medium"
approval_policy = "never"
sandbox_mode = "workspace-write"

[profiles.spark]
model = "gpt-5.3-codex-spark"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
model_verbosity = "low"
approval_policy = "never"
sandbox_mode = "workspace-write"

[profiles.reviewer]
model = "gpt-5.5"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_verbosity = "high"
approval_policy = "never"
sandbox_mode = "read-only"

[profiles.security]
model = "gpt-5.5"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
model_verbosity = "high"
approval_policy = "never"
sandbox_mode = "read-only"

[profiles.docs]
model = "gpt-5.4-mini"
model_reasoning_effort = "low"
plan_mode_reasoning_effort = "medium"
model_verbosity = "low"
approval_policy = "never"
sandbox_mode = "workspace-write"

[profiles.fallback]
model = "gpt-5.2"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_verbosity = "medium"
approval_policy = "never"
sandbox_mode = "workspace-write"

# Use only in a trusted isolated worktree when workspace-write blocks git operations.
[profiles.full-access]
model = "gpt-5.4"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
model_verbosity = "medium"
approval_policy = "never"
sandbox_mode = "danger-full-access"
