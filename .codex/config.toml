# .codex/config.toml
# Codex project config for the codex-org autonomous engineering org.
#
# Roles (ceo, cto, architect, implementer, reviewer, auditor) live in
# .codex/agents/<role>.toml. Their canonical prompts live in prompts/<role>.md.
# The codex-org pipeline reads prompts/<role>.md directly via scripts/codex-org.

model = "gpt-5.5"

model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
model_reasoning_summary = "auto"
model_verbosity = "medium"

# No repeated prompts — codex-org runs unattended (yolo + danger-full-access).
approval_policy = "never"

# Full access required for git operations (commit, merge, worktree create).
sandbox_mode = "danger-full-access"

[agents]
# Keep fan-out controlled.
max_threads = 3
max_depth = 1
job_max_runtime_seconds = 1200
